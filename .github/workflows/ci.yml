name: CI

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/check-openphone-messages-endpoint.mjs
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: node --experimental-strip-types --test scripts/check-openphone-messages-endpoint.test.mjs supabase/functions/_shared/send-sms.test.ts supabase/functions/_shared/sms-opt-out.test.ts src/lib/subscriptionWebhookEvent.test.ts
