  # Public checkout endpoints — anonymous /pricing visitors hit these.
  # The functions still detect a Bearer token if present (in-app
  # upgrade) and run the grandfathered-lifetime guard for those.
  [functions.create-subscription]
    verify_jwt = false

  [functions.buy-lifetime]
    verify_jwt = false

  # Called from /checkout/success with the Stripe session_id so the user's
  # access is provisioned synchronously — independent of webhook delivery
  # timing. Anonymous-checkout buyers have no session yet, so JWT off.
  [functions.reconcile-checkout-session]
    verify_jwt = false

  # Public contact form on /contact — anonymous visitors hit it.
  [functions.notify-contact-form]
    verify_jwt = false

  # TidyWise SaaS cancellation notifier — invoked server-side by the
  # cancel functions (self-cancel-subscription, admin-cancel-subscription).
  # No public callers, but JWT verify off so the invoker doesn't need to
  # forward the user's token; auth happens upstream in the cancel function.
  [functions.notify-tidywise-cancellation]
    verify_jwt = false

  # One-shot recovery for orphaned Stripe subscriptions (jigdahifash
  # incident). Self-gates via is_platform_admin RPC inside the handler,
  # so verify_jwt is left off to keep that one source of truth.
  [functions.recover-stripe-subscription]
    verify_jwt = false
  [functions.notify-quote-accepted]
    verify_jwt = false
  [functions.notify-password-changed]
    verify_jwt = false
  [functions.notify-invoice-paid]
    verify_jwt = false

  # Admin-only portal password reset. Requires a real authenticated caller:
  # the org is resolved from the portal user server-side, then requireOrgAdmin
  # validates the bearer token against THAT org.
  [functions.admin-reset-portal-password]
    verify_jwt = true

  # Cron-driven broadcast send worker. pg_cron cannot present a user JWT and
  # this project's vault has no service-role secret, so the gateway check is
  # off and requireCronSecret (x-cron-secret) is the real gate.
  [functions.broadcast-dispatch]
    verify_jwt = false


  # Nightly Revenue-tab backfill. pg_cron cannot present a user JWT, so the
  # gateway check is off; the function authorizes internally on all three
  # paths (x-cron-secret, x-admin-secret, platform-admin JWT).
  [functions.billing-backfill]
    verify_jwt = false

  # Throwaway IMAP spike. Cron-secret gated internally; gateway JWT off so it
  # can be invoked with x-cron-secret like the other cron-only functions.
  [functions.imap-bounce-spike]
    verify_jwt = false

