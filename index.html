<!doctype html>
<html lang="en">
  <head>
    <!-- Order matters for SEO scorers: charset → viewport → title →
         description → og:* → twitter:* → canonical → THEN scripts/links. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="google-site-verification" content="MIS47q-nvXoW-oBhKA38IAOrcbeJyFVssRPJXVlkU24" />

    <title>TidyWise — Cleaning Business Software for Maid Services</title>
    <meta name="description" content="The all-in-one platform for cleaning business owners. Online booking, scheduling, invoicing, payments, and CRM in one dashboard. Plans from $49/mo." />

    <!-- Open Graph (defaults; SEOHead updates per route) -->
    <meta property="og:title" content="TidyWise — Cleaning Business Software" />
    <meta property="og:description" content="The all-in-one platform for cleaning business owners. Online booking, scheduling, invoicing, payments, and CRM in one dashboard." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TidyWise" />
    <meta property="og:image" content="https://www.jointidywise.com/images/tidywise-og.png" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1080" />
    <meta property="og:url" content="https://www.jointidywise.com/" />

    <!-- Twitter Card (defaults; SEOHead updates per route) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TidyWise — Cleaning Business Software" />
    <meta name="twitter:description" content="The all-in-one platform for cleaning business owners. Online booking, scheduling, invoicing, payments, and CRM in one dashboard." />
    <meta name="twitter:image" content="https://www.jointidywise.com/images/tidywise-og.png" />

    <!-- Canonical (default; SEOHead updates href per route) -->
    <link rel="canonical" href="https://www.jointidywise.com/" />

    <!-- Mobile / PWA hints (after the SEO-critical block) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Matches manifest.theme_color in vite.config.ts. Derived from
         --primary: 230 100% 50% in src/index.css; if a brand doc has a
         canonical hex, change BOTH or the title bar and the installed icon
         will disagree. -->
    <meta name="theme-color" content="#002aff" />

    <!-- Author & Keywords (not managed by SEOHead) -->
    <meta name="author" content="TidyWise" />
    <meta name="keywords" content="cleaning business software, maid service software, cleaning company CRM, booking software for cleaning business, house cleaning software, cleaning scheduling software, janitorial software, housekeeping management, Booking Koala alternative, Jobber alternative, cleaning business management software" />


    <!-- Default for the SPA shell. Prerender sets index,follow on real pages.
         A path that falls through to this file is not the homepage: the
         script below noindexes it and drops the homepage canonical. -->
    <meta name="robots" content="noindex, nofollow" />
    <script>
      (function () {
        var path = location.pathname.replace(/\/+$/, "") || "/";
        if (path === "/") return;
        var canonical = document.querySelector('link[rel="canonical"]');
        if (!canonical) return;
        var href = canonical.getAttribute("href") || "";
        var canonicalPath = "/";
        try {
          canonicalPath = new URL(href).pathname.replace(/\/+$/, "") || "/";
        } catch (e) {}
        if (canonicalPath !== "/") return;
        var robots = document.querySelector('meta[name="robots"]');
        if (robots) robots.setAttribute("content", "noindex, nofollow");
        if (canonical.parentNode) canonical.parentNode.removeChild(canonical);
      })();
    </script>

    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Preload optimized logo (non-blocking) -->
    <link rel="preload" as="image" href="/images/tidywise-logo.webp" type="image/webp" />
    
    <!-- DNS prefetch & preconnect for third-party services -->
    <link rel="dns-prefetch" href="https://slwfkaqczvwvvvavkgpr.supabase.co" />
    <link rel="preconnect" href="https://slwfkaqczvwvvvavkgpr.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://js.stripe.com" />
    <link rel="dns-prefetch" href="https://maps.googleapis.com" />

    <!-- Print Shop typography: Space Grotesk display + IBM Plex Sans body + IBM Plex Mono numerals.
         Async load (preload + onload swap) so the font stylesheet doesn't block first paint.
         display=swap in the URL ensures fallback fonts render immediately while Google's
         font files download in the background. <noscript> covers JS-disabled clients. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" />
    </noscript>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
